apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-parking-device
  namespace: smart-parking
  labels:
    app: smart-parking-device
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-parking-device
  template:
    metadata:
      labels:
        app: smart-parking-device
    spec:
      initContainers:
        - name: wait-for-smart-parking-order
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z smart-parking-order 8084; do echo "waiting for order..."; sleep 2; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: smart-parking-device
          image: smart-parking-device:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/config/common.yml"
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: NACOS_ADDR
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: MYSQL_HOST
            - name: MYSQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: MYSQL_PORT
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: REDIS_PORT
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: RABBITMQ_PORT
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: smart-parking-secret
                  key: MYSQL_PASSWORD
          volumeMounts:
            - name: app-config
              mountPath: /config
              readOnly: true
          # 探针：actuator 全覆盖（smart-parking-* 全部接入）。
          # liveness 只查应用本身（不查外部依赖，DB 抖动不误杀）；readiness 查 DB/Redis/MQ/Nacos 依赖，未就绪不接流量。
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: app-config
          configMap:
            name: smart-parking-config
---
apiVersion: v1
kind: Service
metadata:
  name: smart-parking-device
  namespace: smart-parking
  labels:
    app: smart-parking-device
spec:
  type: ClusterIP
  selector:
    app: smart-parking-device
  ports:
    - name: http
      port: 8087
      targetPort: http
