apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-parking-gateway
  namespace: smart-parking
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smart-parking-gateway
                port:
                  number: 8080
