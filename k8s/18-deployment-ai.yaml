apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-parking-ai
  namespace: smart-parking
  labels:
    app: smart-parking-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-parking-ai
  template:
    metadata:
      labels:
        app: smart-parking-ai
    spec:
      containers:
        - name: smart-parking-ai
          image: smart-parking-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "file:/config/common.yml"
            - name: NACOS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: smart-parking-infra
                  key: NACOS_ADDR
          volumeMounts:
            - name: app-config
              mountPath: /config
              readOnly: true
          # 探针：业务模块大多未接 actuator，用 TCP 探针保证通用（后续可升级 httpGet /actuator/health）
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: app-config
          configMap:
            name: smart-parking-config
---
apiVersion: v1
kind: Service
metadata:
  name: smart-parking-ai
  namespace: smart-parking
  labels:
    app: smart-parking-ai
spec:
  type: ClusterIP
  selector:
    app: smart-parking-ai
  ports:
    - name: http
      port: 8090
      targetPort: http
