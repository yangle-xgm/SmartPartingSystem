spring:
  cloud:
    gateway:
      routes:
        # 用户服务
        - id: smart-parking-user
          uri: lb://smart-parking-user
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=0

        # 操作审计服务（AuditLogController 部署在 user 服务内）
        - id: smart-parking-audit
          uri: lb://smart-parking-user
          predicates:
            - Path=/api/audit/**
          filters:
            - StripPrefix=0

        # 车位服务
        - id: smart-parking-parking
          uri: lb://smart-parking-parking
          predicates:
            - Path=/api/parking/**
          filters:
            - StripPrefix=0

        # 车辆服务
        - id: smart-parking-vehicle
          uri: lb://smart-parking-vehicle
          predicates:
            - Path=/api/vehicle/**
          filters:
            - StripPrefix=0

        # 订单服务
        - id: smart-parking-order
          uri: lb://smart-parking-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=0

        # 支付服务
        - id: smart-parking-payment
          uri: lb://smart-parking-payment
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=0

        # 通知服务
        - id: smart-parking-notify
          uri: lb://smart-parking-notify
          predicates:
            - Path=/api/notify/**
          filters:
            - StripPrefix=0

        # 设备服务
        - id: smart-parking-device
          uri: lb://smart-parking-device
          predicates:
            - Path=/api/device/**
          filters:
            - StripPrefix=0

        # 统计服务
        - id: smart-parking-stats
          uri: lb://smart-parking-stats
          predicates:
            - Path=/api/stats/**
          filters:
            - StripPrefix=0

        # AI服务
        - id: smart-parking-ai
          uri: lb://smart-parking-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=0

      # 默认过滤器
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

      # 全局跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            # 报告 P1-5：原为 allowedOriginPatterns: "*" 且 allowCredentials: true，
            # 任何站点都能带着凭证跨域调全站接口。改为显式白名单，本地开发默认放行两个前端，
            # 部署时用 SP_CORS_ORIGINS（逗号分隔）覆盖，切勿再写回 "*"。
            # 追加私有网段通配：手机经热点(192.168.137.x)或校园网(10.x)访问前端时，浏览器会给
            # POST 带上该来源的 Origin，不含则网关直接 403 空体（前端只能兜底成「请求失败」）。
            allowedOriginPatterns: "${SP_CORS_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://192.168.*:*,http://10.*:*,http://172.16.*:*}"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

  data:
    redis:
      host: localhost
      port: 6380
      database: 0

# 日志
logging:
  level:
    org.springframework.cloud.gateway: debug

# ============ 可观测性：暴露 Prometheus 指标 ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
