global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 抓取配置：拉取各微服务暴露的 /actuator/prometheus 与 Prometheus 自身
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'smart-parking-stats'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # stats 服务在宿主机运行时（Docker 容器内 Prometheus 通过 host.docker.internal 访问宿主机）
      # 若把 smart-parking-stats 也编排进本 compose 网络，可改为 ['smart-parking-stats:8088']
      - targets: ['host.docker.internal:8088']

  - job_name: 'smart-parking-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'smart-parking-order'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']

  - job_name: 'smart-parking-payment'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8085']

  - job_name: 'smart-parking-parking'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']

  - job_name: 'smart-parking-device'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8087']

  # 以下四个服务为 actuator 全覆盖时新增接入（user/vehicle/notify/ai）
  - job_name: 'smart-parking-user'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'smart-parking-vehicle'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']

  - job_name: 'smart-parking-notify'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8086']

  - job_name: 'smart-parking-ai'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8090']
