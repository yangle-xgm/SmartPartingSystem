# ============ 可观测性（actuator + prometheus） ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  # 头像上传：Spring 默认单文件 1MB，前端允许 2MB，不放开会出现
  # MaxUploadSizeExceededException（500）而不是可读的业务提示
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    # 默认开启：启动时自动执行 classpath:db/migration 下的增量脚本（各模块独立 history 表）。
    # 无 DB 的 CI 场景用环境变量 SP_FLYWAY_ENABLED=false 关闭。
    enabled: ${SP_FLYWAY_ENABLED:true}
    table: schema_history_user
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 基线版本设为 0：新库（以及"仅其它模块已建表"的共享库）都能从 V1 开始全量执行。
    # 注意不能用 "2" —— 8 个模块共用同一 schema，任一模块建表后 schema 即非空，
    # 后续模块会被 Flyway 视为"存量库"而跳过自己的 V1/V2，导致自身表永远建不出来。
    # V1 已全部改为 CREATE TABLE IF NOT EXISTS、V2 用 INSERT IGNORE，重复执行安全。
    baseline-version: "0"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/smart_parking?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 21491879
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 10000ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.smartparking: debug
