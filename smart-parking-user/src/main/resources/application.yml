# ============ 可观测性（actuator + prometheus） ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

spring:
  flyway:
    # 默认开启：启动时自动执行 classpath:db/migration 下的增量脚本（各模块独立 history 表）。
    # 无 DB 的 CI 场景用环境变量 SP_FLYWAY_ENABLED=false 关闭。
    enabled: ${SP_FLYWAY_ENABLED:true}
    table: schema_history_user
    locations: classpath:db/migration
    baseline-on-migrate: true
    # V1/V2 是建表与种子脚本，存量库已手工执行过；非空库以 V2 为基线跳过它们，只增量执行 V3+
    baseline-version: "2"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/smart_parking?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 21491879
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 10000ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.smartparking: debug
