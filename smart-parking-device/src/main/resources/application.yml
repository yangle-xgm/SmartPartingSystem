spring:
  flyway:
    # 默认开启：启动时自动执行 classpath:db/migration 下的增量脚本（各模块独立 history 表）。
    # 无 DB 的 CI 场景用环境变量 SP_FLYWAY_ENABLED=false 关闭。
    enabled: ${SP_FLYWAY_ENABLED:true}
    table: schema_history_device
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 基线版本设为 0：新库（以及"仅其它模块已建表"的共享库）都能从 V1 开始全量执行。
    # 注意不能用 "2" —— 8 个模块共用同一 schema，任一模块建表后 schema 即非空，
    # 后续模块会被 Flyway 视为"存量库"而跳过自己的 V1/V2，导致自身表永远建不出来。
    # V1 已全部改为 CREATE TABLE IF NOT EXISTS、V2 用 INSERT IGNORE，重复执行安全。
    baseline-version: "0"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/smart_parking?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 21491879
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 10000ms

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

mqtt:
  # 宿主机1883被Windows保留端口范围占用，RabbitMQ MQTT映射到18830
  broker: tcp://localhost:18830
  client-id: smart-parking-device-service
  username: guest
  password: guest

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.smartparking: debug
    org.eclipse.paho: info

# ============ 可观测性：暴露 Prometheus 指标 ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ============ 设备厂商通道（沙箱/厂商协议） ============
smart-parking:
  # 订单服务地址（摄像头联动入场/出场结算）
  order-url: http://localhost:8084
  device:
    # 默认厂商通道：设备记录未填 vendor 时用它。
    #   sandbox    JSON 指令 + ACK 回执（内置模拟器应答，可端到端确认）
    #   mqtt-plain 纯文本 OPEN/CLOSE，兼容老版 broker 模拟器（无回执）
    # 新增厂商：实现 GateAdapter 并返回自己的 vendor 码，此处无需改动。
    gate-vendor: ${SP_GATE_VENDOR:sandbox}
    # 等待设备 ACK 的超时（毫秒），超时只告警不阻断放行
    gate-ack-timeout-ms: 1500
    # 严格模式：true 表示没收到 ACK 就判定失败（现场设备真实支持回执时才开）
    strict-ack: false
    simulator:
      # 虚拟道闸：订阅指令主题并回执，让"下发→执行→回执"在无硬件时也能闭环
      enabled: ${SP_GATE_SIMULATOR:true}
