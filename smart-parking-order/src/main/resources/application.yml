spring:
  flyway:
    # 默认开启：启动时自动执行 classpath:db/migration 下的增量脚本（各模块独立 history 表）。
    # 无 DB 的 CI 场景用环境变量 SP_FLYWAY_ENABLED=false 关闭。
    enabled: ${SP_FLYWAY_ENABLED:true}
    table: schema_history_order
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 基线版本设为 0：新库（以及"仅其它模块已建表"的共享库）都能从 V1 开始全量执行。
    # 注意不能用 "2" —— 8 个模块共用同一 schema，任一模块建表后 schema 即非空，
    # 后续模块会被 Flyway 视为"存量库"而跳过自己的 V1/V2，导致自身表永远建不出来。
    # V1 已全部改为 CREATE TABLE IF NOT EXISTS、V2 用 INSERT IGNORE，重复执行安全。
    baseline-version: "0"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/smart_parking?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 21491879
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 10000ms

  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.smartparking: debug

# ============ 自定义配置 ============
smart-parking:
  # 车辆服务地址（车牌识别/绑定）
  vehicle-url: http://localhost:8083
  # 车位服务地址（空闲车位查询）
  parking-url: http://localhost:8082
  # 用户服务地址（操作审计）
  audit-url: http://localhost:8081
  # 通知服务地址（待支付催缴）
  notify-url: http://localhost:8086
  # 出场分级放行：实际生效额度 = max(本兜底值, 该计费规则的单日封顶)。
  # 本值只在规则没有日封顶（如月租）时生效 —— 小区停车时长以天计，额度必须跟单日封顶走，
  # 否则「按时长阈值」会把业主日常停车整类拦在出口。
  # 当前规则：临停 2.00/h 封顶 15、新能源 1.50/h 封顶 15、访客 1.00/h 封顶 15
  # （不办月卡的业主月量级约 450 元，月卡 300 元仍保留价差但不构成惩罚性定价）。
  gate:
    credit-limit-amount: ${SP_GATE_CREDIT_LIMIT:6.00}
  # 出场后允许的支付窗口（分钟）：到期把应收标为已关闭(3)，但保留"已完成"状态可追缴。
  # 语义与 payment 的 payment-timeout-minutes（关支付流水）不同，调整时两边建议取同值。
  order:
    pay-window-minutes: ${SP_ORDER_PAY_WINDOW_MINUTES:30}
  # 欠费策略：出场后 24h 催缴、48h 记欠费，欠费超限列入车辆黑名单（status=1，入场即拦）
  arrearage:
    remind-after-hours: ${SP_ARREAR_REMIND_HOURS:24}
    arrear-after-hours: ${SP_ARREAR_HOURS:48}
    count-limit: ${SP_ARREAR_COUNT_LIMIT:3}
    amount-limit: ${SP_ARREAR_AMOUNT_LIMIT:100.00}

# ============ 可观测性：暴露 Prometheus 指标 ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
