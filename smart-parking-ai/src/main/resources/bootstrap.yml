server:
  port: 8090

spring:
  application:
    name: smart-parking-ai
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8849
        namespace: smart-parking
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8849
        namespace: smart-parking
        group: DEFAULT_GROUP
        file-extension: yml

# AI 配置（不填则走模拟模式）
ai:
  # 车牌识别：baidu / mock
  plate:
    provider: mock
    baidu-api-key: ""
    baidu-secret-key: ""
  # 智能客服：doubao / mock
  chat:
    provider: mock
    # 火山方舟 API Key（console.volcengine.com/ark → API 密钥管理）
    doubao-api-key: ""
    # 推理接入点 ID，格式 ep-xxxx（chat/completions 的 model 字段必须填这个，不是模型名）
    doubao-endpoint-id: ""
    # 可选：自定义接入点域名，默认北京地域
    doubao-base-url: "https://ark.cn-beijing.volces.com/api/v3/chat/completions"
