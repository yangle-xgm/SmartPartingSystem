spring:
  flyway:
    # 默认开启：启动时自动执行 classpath:db/migration 下的增量脚本（各模块独立 history 表）。
    # 无 DB 的 CI 场景用环境变量 SP_FLYWAY_ENABLED=false 关闭。
    enabled: ${SP_FLYWAY_ENABLED:true}
    table: schema_history_stats
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 基线版本设为 0：新库（以及"仅其它模块已建表"的共享库）都能从 V1 开始全量执行。
    # 注意不能用 "2" —— 8 个模块共用同一 schema，任一模块建表后 schema 即非空，
    # 后续模块会被 Flyway 视为"存量库"而跳过自己的 V1/V2，导致自身表永远建不出来。
    # V1 已全部改为 CREATE TABLE IF NOT EXISTS、V2 用 INSERT IGNORE，重复执行安全。
    baseline-version: "0"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/smart_parking?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 21491879
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 10000ms

  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.smartparking: debug

# ---------- 可观测性：Actuator / Prometheus 端点 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ---------- 监控闭环（AI 原生 SDLC 维护阶段） ----------
monitor:
  enabled: true
  # Prometheus 基础地址；Docker 网络内用服务名，本地裸跑用 localhost
  prometheus-base-url: http://prometheus:9090
  # bands 配置位置：支持 classpath:/ 或 file:/（运行时挂载覆盖）
  bands-location: classpath:/bands.yaml
  # 越界时生成的 intent 文件输出目录
  output-dir: ./monitor-intents
  # 轮询间隔（毫秒）
  fixed-delay-ms: 60000
