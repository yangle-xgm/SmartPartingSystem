spring:
  flyway:
    # 默认开启：启动时自动执行 classpath:db/migration 下的增量脚本（各模块独立 history 表）。
    # 无 DB 的 CI 场景用环境变量 SP_FLYWAY_ENABLED=false 关闭。
    enabled: ${SP_FLYWAY_ENABLED:true}
    table: schema_history_payment
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 基线版本设为 0：新库（以及"仅其它模块已建表"的共享库）都能从 V1 开始全量执行。
    # 注意不能用 "2" —— 8 个模块共用同一 schema，任一模块建表后 schema 即非空，
    # 后续模块会被 Flyway 视为"存量库"而跳过自己的 V1/V2，导致自身表永远建不出来。
    # V1 已全部改为 CREATE TABLE IF NOT EXISTS、V2 用 INSERT IGNORE，重复执行安全。
    baseline-version: "0"
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3307/smart_parking?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 21491879
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000

  data:
    redis:
      host: localhost
      port: 6380
      database: 0
      timeout: 10000ms

  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest
    virtual-host: /
    publisher-confirm-type: correlated

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.smartparking: debug

# ============ 可观测性：暴露 Prometheus 指标 ============
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# ============ 自定义配置 ============
smart-parking:
  # 支付超时补偿：待支付超过该分钟数即触发补偿（演示可调小为 1）
  payment-timeout-minutes: 30
  # 订单服务地址（内部关单调用）
  order-url: http://localhost:8084
  # 用户服务地址（操作审计）
  audit-url: http://localhost:8081
  # 网关地址（支付确认直连兜底）
  gateway-url: http://localhost:8080
  # 服务间内部令牌：经网关调用 /api/**/internal/** 时必须携带，须与网关 gateway.internal-token 一致
  internal-token: ${SP_INTERNAL_TOKEN:SmartParking-Internal-2026}

  # ============ 支付宝沙箱渠道 ============
  # 沙箱账号（2026-11-19 实配）：APPID=9021000172614567，加签方式=「系统默认密钥（公钥模式已启用）」。
  # 系统默认密钥模式下密钥对由支付宝生成，在控制台「公钥模式 已启用」右侧点「查看」复制，
  # 不需要上传自建应用公钥（那是「自定义密钥」模式的做法）。
  #
  # 四个值全部从环境变量注入（IDEA 运行配置 / 容器 env），密钥永不写入本文件：
  #   SP_ALIPAY_ENABLED / SP_ALIPAY_APP_ID / SP_ALIPAY_PRIVATE_KEY / SP_ALIPAY_PUBLIC_KEY
  # ⚠️ 千万别把占位符改成字面量再留空（如 private-key: ''）：yml 一旦给了值就不会再读环境变量，
  #    表现是 APPID 生效、密钥恒为空、ready 永远 false，且极难排查。
  #
  # 沙箱与生产同一套 OpenAPI，切生产只改 gateway-url + APPID + 两把密钥，Java 代码零改动。
  alipay:
    enabled: ${SP_ALIPAY_ENABLED:false}
    gateway-url: ${SP_ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    app-id: ${SP_ALIPAY_APP_ID:}
    private-key: ${SP_ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${SP_ALIPAY_PUBLIC_KEY:}
    sign-type: RSA2
    charset: UTF-8
    # 异步通知需公网可达；本机演示用 POST /api/payment/alipay/query 主动查询闭环
    notify-url: ${SP_ALIPAY_NOTIFY_URL:http://localhost:8080/api/payment/callback/alipay/notify}
    return-url: ${SP_ALIPAY_RETURN_URL:http://localhost:3001/#/orders}
    subject-prefix: 智慧停车
    timeout-minutes: 30
